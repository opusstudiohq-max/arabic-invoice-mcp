<!DOCTYPE html>
<!--
  قالبُ الصفحة الأولى.

  القالب الافتراضي لـGitHub Pages يُخرج `<html lang="en-US">` بلا `dir`،
  وعنواناً أوّلَ هو **اسم المستودع** — على صفحةٍ محتواها عربي بالكامل.
  فالنصّ يُحاذى يساراً، وعلاماتُ الترقيم تقع في غير موضعها، وأوّل ما يقرؤه
  الزائر «arabic-invoice-mcp» لا ما تفعله الأدوات.

  وهذا القالب يملك الثلاثة: اللغة، والاتجاه، والعنوان — ويضيف سبيلَ تواصل،
  فقد كانت الصفحة الأولى وحدها بلا واحد بينما بقيةُ الأسطح السبعة فيها.
-->
<html lang="{{ site.lang | default: 'ar' }}" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title | default: site.github.repository_name }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="{{ site.title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
<meta name="twitter:card" content="summary">
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --ink:#16202b; --muted:#5d6b7a; --line:#e0e6ec;
    --accent:#0d5c47; --ok-bg:#e8f5f0;
  }
  @media(prefers-color-scheme:dark){
    :root{--bg:#12161b; --card:#1a1f26; --ink:#e6eaef; --muted:#9aa6b4;
          --line:#2a323c; --accent:#3fae8f; --ok-bg:#14261f;}
  }
  *{box-sizing:border-box}
  body{margin:0;padding:0 1rem 4rem;background:var(--bg);color:var(--ink);
       font:16px/1.8 "Segoe UI","Noto Sans Arabic",system-ui,sans-serif}
  main{max-width:900px;margin:0 auto}
  h1{font-size:clamp(1.6rem,4.5vw,2.2rem);margin:2.5rem 0 .5rem;letter-spacing:-.01em}
  h2{font-size:1.25rem;margin:2.5rem 0 .8rem;padding-top:1rem;
     border-top:1px solid var(--line)}
  h3{font-size:1rem;margin:1.5rem 0 .5rem}
  p,li{max-width:70ch}
  a{color:var(--accent)}
  .scroll,table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;background:var(--card);
        border:1px solid var(--line);border-radius:10px;margin:1rem 0}
  th,td{padding:.6rem .8rem;text-align:right;border-bottom:1px solid var(--line);
        vertical-align:top}
  th{background:var(--bg);font-size:.85rem;color:var(--muted)}
  tr:last-child td{border-bottom:none}
  /* الرموز التقنية تُعزل اتجاهياً: «@talha7k/zatca-qr» في فقرةٍ يمينية
     يُعرض «talha7k/zatca-qr@» بلا عزل — X6a من UAX #9. */
  code{font-family:ui-monospace,Consolas,monospace;font-size:.88em;
       background:var(--bg);border:1px solid var(--line);border-radius:4px;
       padding:.1em .35em;unicode-bidi:isolate;direction:ltr}
  pre{background:var(--card);border:1px solid var(--line);border-radius:10px;
      padding:1rem;overflow-x:auto;direction:ltr;text-align:left}
  pre code{background:none;border:none;padding:0}
  blockquote{margin:1rem 0;padding:.6rem 1rem;border-inline-start:3px solid var(--accent);
             background:var(--card);border-radius:0 8px 8px 0;color:var(--muted)}
  hr{border:none;border-top:1px solid var(--line);margin:2rem 0}
  img{max-width:100%;height:auto}
  .contact{background:var(--ok-bg);border:1px solid var(--accent);border-radius:10px;
           padding:1rem 1.2rem;margin:2.5rem 0 0}
  .contact code{user-select:all}
  footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--line);
         color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<main>

{{ content }}

<div class="contact">
  نبني تكاملات فوترة إلكترونية ونصلح المكسور منها — بنطاقٍ وسعرٍ واضحين.
  <a href="mailto:yahya@opus-studio.pro?subject=%D8%B3%D8%A4%D8%A7%D9%84%20%D8%B9%D9%86%20%D8%A7%D9%84%D9%81%D9%88%D8%AA%D8%B1%D8%A9%20%D8%A7%D9%84%D8%A5%D9%84%D9%83%D8%AA%D8%B1%D9%88%D9%86%D9%8A%D8%A9">راسلنا</a>
  أو انسخ العنوان: <bdi dir="ltr"><code>yahya@opus-studio.pro</code></bdi>
</div>

<footer>
  <p>
    مفتوح المصدر (MIT) —
    <a href="https://github.com/{{ site.github.owner_name }}/{{ site.github.repository_name }}">المستودع على GitHub</a>
  </p>
</footer>

</main>
</body>
</html>
